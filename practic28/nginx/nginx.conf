# nginx/nginx.conf
events {
    worker_connections 1024;
}

http {
    upstream backend {
        server backend1:3000 max_fails=2 fail_timeout=30s;
        server backend2:3000 max_fails=2 fail_timeout=30s backup;
    }

    server {
        listen 80;

        # API запросы → балансировщик
        location /api {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # CORS для API
            add_header 'Access-Control-Allow-Origin' 'http://localhost:3003' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;

            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' 'http://localhost:3003' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;
                add_header 'Content-Length' 0;
                add_header 'Content-Type' 'text/plain charset=UTF-8';
                return 204;
            }
        }

        # 🆕 Статика (загруженные изображения) → напрямую на backend1
        # (volume ./backend/uploads:/app/uploads примонтирован к обоим бэкендам)
        location /uploads {
            proxy_pass http://backend1:3000;
            proxy_set_header Host $host;
            
            # CORS для статики
            add_header 'Access-Control-Allow-Origin' 'http://localhost:3003' always;
        }

        # Health check
        location /api/check-balance {
            proxy_pass http://backend;
        }
    }
}